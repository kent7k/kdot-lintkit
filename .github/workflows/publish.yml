name: publish

# npmjs へ trusted publishing（OIDC）で出す。token は持たない。
# 前提: npmjs の各パッケージの Settings → Trusted publisher に
#   repository = kent7k/kdot-lintkit・workflow = publish.yml を登録済（初回 publish だけ手元から token で出す）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # trusted publishing は Node >= 22.14・npm >= 11.5.1。Node 24 は npm 11 を同梱する。
          # registry-url は渡さない（渡すと NODE_AUTH_TOKEN 前提の .npmrc が書かれる）。
          node-version: 24
      - run: npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm publish:all
